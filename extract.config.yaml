# extract.config.yaml — standalone package export for @warpgogol/projektarchiv-core

projectDir: packages/projektarchiv-core
destName: projektarchiv-core
standalone: true
versionBump: patch

workspacePrefixes:
  - "@warpgogol/"
stripScopes:
  - "@warpgogol/"
preservePackages:
  - "@warpgogol/projektarchiv-core"
packageManager: pnpm

ci:
  provider: github-actions
  publish: true
  nodeVersion: 24
  provenance: true

ignoreDirs:
  - .turbo
  - node_modules

excludePathSegments:
  - .npmrc
  - pnpm-lock.yaml
  - tests
  - testing

postProcess:
  - action: delete
    path: pnpm-lock.yaml

git:
  remote: git@github.com:syrokomskyi/projektarchiv-core.git
  autoPush: true
